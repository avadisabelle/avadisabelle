name: Publish the Sanctuaire portal

# Every push to the default branch weaves the portal out to the domain.
# The README stays where it is — this only publishes the ./site portal.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege: read the repo, write a Pages deployment, prove identity.
permissions:
  contents: read
  pages: write
  id-token: write

# One weaving at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the loom
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the portal (./site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to the domain
        id: deploy
        uses: actions/deploy-pages@v4
